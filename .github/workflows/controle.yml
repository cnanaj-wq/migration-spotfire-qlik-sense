name: Contrôle automatique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntaxe et mise en forme des scripts
        run: |
          ruff check .
          ruff format --check .
      - name: Régénération des données
        run: python generer_donnees.py
      - name: Les fichiers CSV régénérés sont identiques à ceux du dépôt
        run: git diff --exit-code -- 'data/*.csv'
      - name: Cohérence entre les tables
        run: python controles/verifier_donnees.py
      - name: LAB 02 - extraction du fichier Spotfire et conversion par règles
        run: |
          python lab02/extraire.py
          python lab02/convertir.py
      - name: Les sorties du LAB 02 régénérées sont identiques à celles du dépôt
        run: git diff --exit-code -- lab02/sorties/
